<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI4S Literature Workbench 配置向导</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <div class="header-row">
          <p id="eyebrow" class="eyebrow">本机设置</p>
          <button id="lang-toggle" class="secondary lang-toggle" type="button">English</button>
        </div>
        <h1>AI4S Literature Workbench <span id="page-title">配置向导</span></h1>
      </header>

      <section id="pairing" class="panel">
        <h2 id="pairing-title">连接这个页面</h2>
        <p id="pairing-help">通常这一步会自动完成。如果页面要求输入配对码，请输入助手给你的配对码；它五分钟内有效，只能用一次。</p>
        <form id="pair-form" autocomplete="off">
          <label id="pair-code-label" for="pair-code">配对码</label>
          <div class="row">
            <input
              id="pair-code"
              name="pair-code"
              type="password"
              required
              autocomplete="off"
              spellcheck="false"
            />
            <button id="pair-submit" type="submit">连接</button>
          </div>
        </form>
        <p id="pair-result" class="result" role="status"></p>
      </section>

      <section id="guided" class="panel" hidden>
        <div id="guided-root"></div>
      </section>

      <section id="wizard" class="panel" hidden>
        <div class="section-heading">
          <div>
            <h2 id="wizard-title">检查并保存密钥</h2>
            <p id="wizard-help">已保存的密钥不会再显示；这里只显示是否已设置，以及它来自哪里。</p>
          </div>
          <button id="refresh-status" class="secondary" type="button">刷新状态</button>
        </div>
        <div id="providers" class="provider-grid"></div>
      </section>

      <section id="status-view" class="panel status-view" hidden>
        <div class="section-heading">
          <div>
            <h2 id="status-title">配置状态</h2>
            <p id="dashboard-read-meta" class="dashboard-meta"></p>
            <p id="status-note" class="dashboard-note">读取状态不代表执行连接测试。</p>
          </div>
          <button id="refresh-dashboard" class="secondary" type="button">刷新状态</button>
        </div>
        <p id="dashboard-status" class="result" role="status"></p>
        <div id="dashboard-root" class="dashboard-root"></div>
      </section>
    </main>
  </body>
</html>
