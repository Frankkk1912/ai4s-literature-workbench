# Workbench CI (Plan M2 / T2.1 / T2.2, V11, D9, D11, R9, R13).
#
# Required status-check names for branch protection (not configured here):
#   test (windows-latest), test (macos-latest), test (ubuntu-latest), secret-scan
#
# Triggers: push and pull_request whose base/target branch is main or feat/**.
# pull_request.branches filters the base branch, so PRs into main or feat/** run.

name: Workbench CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # engines require Node >=22.13 (pdfjs-dist 6.x needs Promise.withResolvers).
      # '22.13' selects the latest 22.13.x. Do not float to '22' without re-verifying.
      - name: Setup Node.js 22.13
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'

      - name: Print Node and npm versions
        run: node --version && npm --version

      # npm ci must precede the root node:test step. tests/env-file-fallback.test.mjs
      # imports runtime/src/lib/env-files.ts. Node 22.13 cannot import .ts natively
      # (ERR_UNKNOWN_FILE_EXTENSION), so the lockfile-pinned tsx loader is still required.
      - name: Runtime install, typecheck, and test
        working-directory: runtime
        run: npm ci --no-audit --no-fund && npm run typecheck && npm test

      # Pass the glob quoted so Node expands it on every OS. On windows-latest the
      # default shell is pwsh, which does not expand globs, and on Node 22.13
      # `--test tests` (a directory) fails with ERR_MODULE_NOT_FOUND tests/index.json.
      - name: Root node tests
        run: node --import ./runtime/node_modules/tsx/dist/loader.mjs --test "tests/*.test.mjs"

      - name: Fulltext install, typecheck, and test
        working-directory: fulltext-runtime
        run: npm ci --no-audit --no-fund && npm run typecheck && npm test

      - name: Database browser install
        working-directory: database-browser-runtime
        run: npm ci --no-audit --no-fund

      # Lockfile playwright (printed below) must exist before install. Playwright
      # 1.61 installDeps is not portable: Linux runs apt (the CLI sudo's apt-get,
      # so do not wrap npx in sudo); macOS is a no-op; Windows runs
      # install_media_pack.ps1. These tests only need the Chromium binary, plus
      # Linux shared libraries. Do not pass --with-deps off Linux.
      - name: Install Playwright Chromium
        working-directory: database-browser-runtime
        run: npx playwright --version && npx playwright install chromium

      - name: Install Playwright Chromium system dependencies
        if: runner.os == 'Linux'
        working-directory: database-browser-runtime
        run: npx playwright install-deps chromium

      - name: Database browser typecheck, build, and test
        working-directory: database-browser-runtime
        run: npm run typecheck && npm run build && npm test

      - name: Literature metrics install, check, and package
        working-directory: literature-metrics
        run: npm ci --no-audit --no-fund && npm run check && npm run package

      # assemble-plugin check requires existing dist entries plus each package's
      # typescript (installed above). It does not build dist itself.
      - name: Build runtime dist
        working-directory: runtime
        run: npm run build

      - name: Build fulltext dist
        working-directory: fulltext-runtime
        run: npm run build

      - name: Workbench structure and artifact check
        run: node scripts/assemble-plugin.mjs check

      # Prebuilt single-file runtimes (Gate 1: they must start on Windows and macOS).
      # verify-bundles.mjs copies them into a temp folder with no node_modules above it,
      # starts each over stdio, checks the exact tool lists, starts the runtime with
      # --http and requests /admin/onboarding, and parses a PDF from a bundle. It prints
      # PASS/FAIL per check, shows the server's stderr on failure, and writes the same
      # table to the run summary.
      - name: Bundle runtime
        working-directory: runtime
        run: npm run bundle

      - name: Bundle fulltext
        working-directory: fulltext-runtime
        run: npm run bundle

      - name: Verify bundles start with no node_modules
        run: node scripts/verify-bundles.mjs

      # The double-click launchers run the bundle with --setup. This is the only place the
      # Windows .bat runs, so it is checked on every OS here, not only in the release dry run.
      - name: Verify the double-click launchers
        run: node scripts/verify-launchers.mjs

  # Dry run of the release packaging on every push and pull request, so a broken
  # .mcpb manifest or archive layout shows up before a tag does. Publishes nothing.
  release-assets:
    name: release assets (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22.13
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'

      - name: Install and bundle runtime
        working-directory: runtime
        run: npm ci --no-audit --no-fund && npm run bundle

      - name: Install and bundle fulltext
        working-directory: fulltext-runtime
        run: npm ci --no-audit --no-fund && npm run bundle

      - name: Build the Zotero add-on
        working-directory: literature-metrics
        run: npm ci --no-audit --no-fund && npm run package

      # Runs `mcpb validate` and `mcpb pack` (pinned in the script).
      - name: Package release assets
        run: node scripts/package-release.mjs --out release-out

      - name: Verify the assets as a user would receive them
        run: node scripts/verify-release.mjs release-out

      - name: Setup Node.js 22.19 for dsh
        uses: actions/setup-node@v6
        with:
          # dsh 0.2.1-rc.2 needs 22.19 or newer; on 22.13 it exits 0 without installing anything.
          node-version: '22.19'

      # Installs the DeepSeek Harness package with a pinned dsh into a scratch profile, then
      # starts both servers from the installed copy. Needs the network; dsh is a developer
      # preview, so a break here is a reason to look at engines.dsh, not a flaky test.
      - name: Install the DeepSeek Harness package with a pinned dsh
        run: node scripts/verify-dsh-install.mjs release-out/dsh-ai4s-literature-workbench.tgz

  # One shared scan job, not a per-OS copy. D9 still requires the three test
  # jobs. D11/R13 require this scan to be a merge gate with the same pinned
  # binary and default rules. ubuntu-latest is the required scan runner:
  # gitleaks/gitleaks-action was not used because its action.yml does not pin
  # the gitleaks binary to v8.30.1, and its default mode is not an explicit
  # `gitleaks git` plus `gitleaks dir` pair under contents:read only.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Official release asset, not the floating action. SHA-256 was checked
      # against gitleaks_8.30.1_checksums.txt and a local download of
      # gitleaks_8.30.1_linux_x64.tar.gz (551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb).
      - name: Install gitleaks v8.30.1
        run: |
          set -euo pipefail
          version="8.30.1"
          asset="gitleaks_${version}_linux_x64.tar.gz"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}"
          curl --fail --silent --show-error --location --retry 3 --output "${asset}" "${url}"
          echo "${expected}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" gitleaks
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 gitleaks "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          installed="$("${HOME}/.local/bin/gitleaks" version)"
          test "${installed}" = "${version}"
          echo "Installed gitleaks ${installed} from ${url}"

      - name: Scan full git history
        run: gitleaks git . --redact --no-banner

      - name: Scan working tree
        run: gitleaks dir . --redact --no-banner
